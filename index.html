<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Birthday Dive</title>

  <!-- Als App auf dem Homescreen -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#06121f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Birthday Dive" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-180.png" />
  <link rel="icon" href="./assets/icons/icon-192.png" />

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="game-root"></div>

  <!-- Hinweis, wenn das Handy hochkant gehalten wird -->
  <div id="rotate-hint" aria-hidden="true">
    <div class="rotate-inner">
      <div class="rotate-icon">📱</div>
      <p class="rotate-title">Bitte dreh dein Handy</p>
      <p class="rotate-sub">Birthday Dive wird im Querformat gespielt.</p>
    </div>
  </div>

  <!-- Phaser als Global – liegt jetzt im Projekt, damit das Spiel auch
       ohne Internet/CDN startet (wichtig bei schlechtem Handy-Empfang) -->
  <script src="./vendor/phaser.min.js"></script>

  <!-- Dein App-Entry -->
  <script type="module" src="./main.js"></script>
</body>
</html>
